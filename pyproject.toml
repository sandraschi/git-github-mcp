[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-github-mcp"
version = "0.1.0"
description = "FastMCP 2.14.4 portmanteau server for Git and GitHub (gh CLI)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastmcp>=2.14.4,<2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
git-github-mcp = "git_github_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/git_github_mcp"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
