[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-github-mcp"
version = "0.3.0"
description = "FastMCP 3.0+ portmanteau server for Git (local) and GitHub (gh CLI)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=3.1.0",
    "uvicorn[standard]>=0.32.0",
    "ruff>=0.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
git-github-mcp = "git_github_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/git_github_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
